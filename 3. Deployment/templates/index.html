<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Platform</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style_.css')}}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#667eea">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        .login-header .icon {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 15px;
        }
        .form-group label {
            color: #555;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .file-upload {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: rgba(102, 126, 234, 0.05);
            transition: all 0.3s ease;
        }
        .file-upload:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        .file-upload input[type="file"] {
            display: none;
        }
        .file-upload-label {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
        }
        .file-upload-label i {
            font-size: 30px;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fas fa-robot icon"></i>
                        <h2>AI Interview Platform</h2>
                        <p>Web Based Selector–Applicant Simulation Software with AI Modelled Score Generation</p>
                    </div>
                    <form action="/home" method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="username"><i class="fas fa-user mr-2"></i>Username</label>
                            <input type="text" class="form-control" id="name" name="username" placeholder="Enter your username" required>
                        </div>
                        <div class="form-group">
                            <label for="position"><i class="fas fa-briefcase mr-2"></i>Position</label>
                            <select class="form-control" id="pos" name="position" required>
                                <option value="">Select a position</option>
                                <option value="Call Center Agent">Call Center Agent</option>
                                <option value="Consultancy">Consultancy</option>
                                <option value="Customer Service">Customer Service</option>
                                <option value="Customer Service Agent">Customer Service Agent</option>
                                <option value="Customer Service Manager">Customer Service Manager</option>
                                <option value="Customer Service Representative">Customer Service Representative</option>
                                <option value="Data Scientist">Data Scientist</option>
                                <option value="Home Health Aide">Home Health Aide</option>
                                <option value="Marketing Manager">Marketing Manager</option>
                                <option value="Medical Assistant">Medical Assistant</option>
                                <option value="Nurse">Nurse</option>
                                <option value="Product Managment">Product Managment</option>
                                <option value="Software Development Engineer">Software Development Engineer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-file-alt mr-2"></i>Upload Resume</label>
                            <div class="file-upload">
                                <label for="resume" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>Click to upload or drag and drop</span>
                                    <small style="display: block; margin-top: 5px; color: #999;">PDF, DOCX, TXT (Max 10MB)</small>
                                </label>
                                <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">
                            <i class="fas fa-arrow-right mr-2"></i>Start Interview
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
